# main에 push하거나 PR을 올리면 포맷·린트·테스트·빌드를 자동으로 확인한다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # package-lock.json에 적힌 버전 그대로 설치한다.
      - run: npm ci

      - name: 포맷 확인
        run: npm run format:check

      - name: 린트
        run: npm run lint

      - name: 테스트
        run: npm test

      - name: 빌드
        run: npm run build
